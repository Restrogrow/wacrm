<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">A rising bar chart of daily WhatsApp messaging limits from 250 upwards</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#34d399" fill="none">
    <circle cx="1040" cy="560" r="240"/><circle cx="1040" cy="560" r="340"/><circle cx="120" cy="60" r="160"/>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <g filter="url(#soft)">
      <rect x="200" y="430" width="150" height="80" rx="12" fill="#064e3b"/>
      <rect x="420" y="330" width="150" height="180" rx="12" fill="#047857"/>
      <rect x="640" y="210" width="150" height="300" rx="12" fill="#10b981"/>
      <rect x="860" y="100" width="150" height="410" rx="12" fill="#34d399"/>
    </g>
    <g font-size="34" font-weight="700" text-anchor="middle" fill="#f8fafc">
      <text x="275" y="410">250</text><text x="495" y="310">2K</text><text x="715" y="190">100K</text><text x="935" y="80">∞</text>
    </g>
    <line x1="160" y1="512" x2="1060" y2="512" stroke="#334155" stroke-width="4"/>
    <text x="200" y="575" font-size="30" fill="#94a3b8">Customers per 24 hours</text>
  </g>
  <text id="rg-brand" x="1172" y="606" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

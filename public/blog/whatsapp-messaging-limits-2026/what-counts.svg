<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Which WhatsApp messages count towards the messaging limit</title>
  <desc id="d">Business-initiated templates to customers with no recent chat count, once per customer. Replies, incoming messages and ad-started chats do not count. Illustration by Repeat Grow (repeatgrow.com).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="90" font-size="40" font-weight="700" fill="#f8fafc">What uses your messaging limit</text>
    <text x="80" y="160" font-size="28" font-weight="700" fill="#fde68a">Counts</text>
    <text x="660" y="160" font-size="28" font-weight="700" fill="#6ee7b7">Does not count</text>
    <g filter="url(#soft)"><rect x="80" y="190" width="480" height="92" rx="18" fill="#1f2937"/>
    <text x="104" y="230" font-size="24" fill="#e5e7eb">Diwali offer template</text>
    <text x="104" y="262" font-size="18" fill="#9ca3af">To a customer with no chat in 24h</text></g>
    <g filter="url(#soft)"><rect x="80" y="310" width="480" height="92" rx="18" fill="#1f2937"/>
    <text x="104" y="350" font-size="24" fill="#e5e7eb">Order update template</text>
    <text x="104" y="382" font-size="18" fill="#9ca3af">To a customer with no chat in 24h</text></g>
    <g filter="url(#soft)"><rect x="80" y="430" width="480" height="92" rx="18" fill="#1f2937"/>
    <text x="104" y="470" font-size="24" fill="#e5e7eb">Same customer, 3 templates</text>
    <text x="104" y="502" font-size="18" fill="#9ca3af">Counts once: unique customers</text></g>
    <g filter="url(#soft)"><rect x="660" y="190" width="480" height="92" rx="18" fill="#065f46"/>
    <text x="684" y="230" font-size="24" fill="#ecfdf5">Reply to a customer</text>
    <text x="684" y="262" font-size="18" fill="#a7f3d0">Who messaged you today</text></g>
    <g filter="url(#soft)"><rect x="660" y="310" width="480" height="92" rx="18" fill="#065f46"/>
    <text x="684" y="350" font-size="24" fill="#ecfdf5">Messages customers send you</text>
    <text x="684" y="382" font-size="18" fill="#a7f3d0">Never counted</text></g>
    <g filter="url(#soft)"><rect x="660" y="430" width="480" height="92" rx="18" fill="#065f46"/>
    <text x="684" y="470" font-size="24" fill="#ecfdf5">Chat from a click-to-WhatsApp ad</text>
    <text x="684" y="502" font-size="18" fill="#a7f3d0">Customer started it</text></g>
    <text x="80" y="600" font-size="24" fill="#94a3b8">Limit = unique customers you start conversations with in a rolling 24 hours.</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

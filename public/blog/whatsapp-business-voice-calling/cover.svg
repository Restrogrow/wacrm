<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">An incoming WhatsApp call ringing on a team inbox with an Answer button</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#34d399" fill="none">
    <circle cx="1040" cy="560" r="240"/>
    <circle cx="1040" cy="560" r="340"/>
    <circle cx="120" cy="60" r="160"/>
  </g>

  <g fill="none" stroke="#34d399" stroke-width="3" opacity="0.5">
    <circle cx="330" cy="315" r="150"/>
    <circle cx="330" cy="315" r="200" opacity="0.6"/>
    <circle cx="330" cy="315" r="250" opacity="0.3"/>
  </g>
  <g transform="translate(330 315)">
    <circle r="100" fill="#10b981"/>
    <path d="M-34 -44 L-14 -44 L-4 -16 L-20 -4 C-10 20 6 36 30 46 L42 30 L70 40 L70 60 C70 68 62 74 54 74 C-4 70 -64 10 -68 -42 C-68 -50 -62 -56 -54 -56 Z" fill="#ffffff" transform="scale(0.8) translate(-4 -4)"/>
  </g>

  <g transform="translate(600 150)" filter="url(#soft)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect width="480" height="330" rx="28" fill="#f8fafc"/>
    <text x="36" y="62" font-size="20" font-weight="700" fill="#059669" letter-spacing="2">INCOMING WHATSAPP CALL</text>
    <text x="36" y="118" font-size="34" font-weight="700" fill="#0f172a">Riya Shah</text>
    <text x="36" y="154" font-size="20" fill="#475569">Ringing on 4 agents</text>
    <rect x="36" y="196" width="190" height="84" rx="18" fill="#10b981"/>
    <text x="131" y="249" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Answer</text>
    <rect x="254" y="196" width="190" height="84" rx="18" fill="#e2e8f0"/>
    <text x="349" y="249" text-anchor="middle" font-size="26" font-weight="700" fill="#334155">Decline</text>
  </g>
  <text id="rg-brand" x="1172" y="606" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

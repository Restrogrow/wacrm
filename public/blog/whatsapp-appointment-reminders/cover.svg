<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">A calendar booking with WhatsApp reminders sent 24 hours and 1 hour before</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#34d399" fill="none">
    <circle cx="1040" cy="560" r="240"/>
    <circle cx="1040" cy="560" r="340"/>
    <circle cx="120" cy="60" r="160"/>
  </g>

  <!-- Calendar -->
  <g transform="translate(120 120)" filter="url(#soft)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect width="420" height="390" rx="28" fill="#f8fafc"/>
    <rect width="420" height="92" rx="28" fill="#10b981"/>
    <rect y="60" width="420" height="32" fill="#10b981"/>
    <rect x="96" y="-22" width="18" height="52" rx="9" fill="#a7f3d0"/>
    <rect x="306" y="-22" width="18" height="52" rx="9" fill="#a7f3d0"/>
    <text x="210" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">October</text>
    <g fill="#cbd5e1">
      <rect x="40" y="126" width="44" height="40" rx="8"/><rect x="110" y="126" width="44" height="40" rx="8"/><rect x="180" y="126" width="44" height="40" rx="8"/><rect x="250" y="126" width="44" height="40" rx="8"/><rect x="320" y="126" width="44" height="40" rx="8"/>
      <rect x="40" y="186" width="44" height="40" rx="8"/><rect x="110" y="186" width="44" height="40" rx="8"/><rect x="250" y="186" width="44" height="40" rx="8"/><rect x="320" y="186" width="44" height="40" rx="8"/>
      <rect x="40" y="246" width="44" height="40" rx="8"/><rect x="110" y="246" width="44" height="40" rx="8"/><rect x="180" y="246" width="44" height="40" rx="8"/><rect x="250" y="246" width="44" height="40" rx="8"/><rect x="320" y="246" width="44" height="40" rx="8"/>
      <rect x="40" y="306" width="44" height="40" rx="8"/><rect x="110" y="306" width="44" height="40" rx="8"/><rect x="180" y="306" width="44" height="40" rx="8"/>
    </g>
    <rect x="174" y="180" width="56" height="52" rx="10" fill="#059669"/>
    <text x="202" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">14</text>
  </g>

  <!-- Connector -->
  <path d="M560 315 C 610 315, 640 230, 700 210" stroke="#34d399" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M560 315 C 610 315, 640 400, 700 420" stroke="#34d399" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- Reminder bubbles -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(700 130)">
      <rect width="400" height="150" rx="22" fill="#d1fae5"/>
      <rect x="22" y="22" width="92" height="30" rx="15" fill="#10b981"/>
      <text x="68" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">24 h</text>
      <text x="22" y="88" font-size="22" font-weight="700" fill="#064e3b">See you tomorrow, Priya</text>
      <text x="22" y="120" font-size="18" fill="#065f46">Tue 14 Oct · 4:30 pm IST</text>
    </g>
    <g transform="translate(700 350)">
      <rect width="400" height="150" rx="22" fill="#d1fae5"/>
      <rect x="22" y="22" width="92" height="30" rx="15" fill="#059669"/>
      <text x="68" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1 h</text>
      <text x="22" y="88" font-size="22" font-weight="700" fill="#064e3b">Starting in 1 hour</text>
      <text x="22" y="120" font-size="18" fill="#065f46">Join: meet.google.com/abc-defg</text>
    </g>
  </g>
</svg>

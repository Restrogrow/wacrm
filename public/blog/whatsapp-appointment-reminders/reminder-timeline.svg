<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">A WhatsApp reminder schedule for appointments</title>
  <desc id="d">Booking confirmation right after booking, a reminder 24 hours before, a reminder 1 hour before with the meeting link, and a follow-up after a cancellation or no-show.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="80" font-size="34" font-weight="700" fill="#0f172a">The reminder schedule that cuts no-shows</text>
    <text x="60" y="118" font-size="20" fill="#475569">Four messages per booking, each an approved Utility template</text>

    <line x1="110" y1="320" x2="1090" y2="320" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <text x="110" y="292" text-anchor="middle" font-size="15" fill="#64748b">Booking</text>
    <text x="870" y="292" text-anchor="middle" font-size="15" fill="#64748b">Meeting</text>
    <line x1="870" y1="300" x2="870" y2="340" stroke="#0f172a" stroke-width="3" stroke-dasharray="4 4"/>

    <g text-anchor="middle">
      <circle cx="110" cy="320" r="30" fill="#10b981"/>
      <text x="110" y="329" font-size="24" font-weight="700" fill="#ffffff">1</text>
      <circle cx="560" cy="320" r="30" fill="#10b981"/>
      <text x="560" y="329" font-size="24" font-weight="700" fill="#ffffff">2</text>
      <circle cx="790" cy="320" r="30" fill="#059669"/>
      <text x="790" y="329" font-size="24" font-weight="700" fill="#ffffff">3</text>
      <circle cx="1090" cy="320" r="30" fill="#fbbf24"/>
      <text x="1090" y="329" font-size="24" font-weight="700" fill="#451a03">4</text>
    </g>

    <g>
      <rect x="40" y="390" width="250" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="62" y="428" font-size="19" font-weight="700" fill="#0f172a">Confirmation</text>
      <text x="62" y="456" font-size="15" fill="#475569">Right after booking.</text>
      <text x="62" y="480" font-size="15" fill="#475569">Date, time, meeting link,</text>
      <text x="62" y="504" font-size="15" fill="#475569">reschedule link.</text>

      <rect x="430" y="390" width="260" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="452" y="428" font-size="19" font-weight="700" fill="#0f172a">24 hours before</text>
      <text x="452" y="456" font-size="15" fill="#475569">Time to plan the day —</text>
      <text x="452" y="480" font-size="15" fill="#475569">and to reschedule</text>
      <text x="452" y="504" font-size="15" fill="#475569">instead of not showing up.</text>

      <rect x="700" y="160" width="250" height="110" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="722" y="198" font-size="19" font-weight="700" fill="#0f172a">1 hour before</text>
      <text x="722" y="226" font-size="15" fill="#475569">"Starting soon" + the</text>
      <text x="722" y="250" font-size="15" fill="#475569">join link or address.</text>

      <rect x="930" y="390" width="230" height="150" rx="16" fill="#fffbeb" stroke="#fde68a"/>
      <text x="952" y="428" font-size="19" font-weight="700" fill="#92400e">Follow-up</text>
      <text x="952" y="456" font-size="15" fill="#b45309">After a cancellation</text>
      <text x="952" y="480" font-size="15" fill="#b45309">or no-show: a link</text>
      <text x="952" y="504" font-size="15" fill="#b45309">to book again.</text>
    </g>

    <text x="60" y="620" font-size="17" fill="#475569">Skip a reminder when the booking was made after that point (e.g. no "24 hours before" for a same-day booking).</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

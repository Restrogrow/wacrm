<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">A Shopify order turning into WhatsApp messages: order confirmed, shipped and delivered</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#34d399">
    <circle cx="160" cy="520" r="220" fill="none"/>
    <circle cx="160" cy="520" r="320" fill="none"/>
    <circle cx="1080" cy="80" r="180" fill="none"/>
  </g>

  <!-- Shopping bag -->
  <g transform="translate(150 175)" filter="url(#soft)">
    <path d="M60 60 Q60 0 130 0 Q200 0 200 60" fill="none" stroke="#a7f3d0" stroke-width="14" stroke-linecap="round"/>
    <rect x="0" y="60" width="260" height="250" rx="28" fill="url(#bag)"/>
    <rect x="0" y="60" width="260" height="250" rx="28" fill="#ffffff" opacity="0.06"/>
    <text x="130" y="200" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#052e1e">ORDER</text>
    <text x="130" y="240" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#064e3b">#1001</text>
  </g>

  <!-- Flow arrow -->
  <g stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.9">
    <path d="M450 330 C 520 330, 560 330, 620 330"/>
  </g>
  <path d="M618 312 L648 330 L618 348 Z" fill="#34d399"/>

  <!-- Phone -->
  <g transform="translate(690 60)" filter="url(#soft)">
    <rect x="0" y="0" width="330" height="510" rx="44" fill="#0b1220" stroke="#1f2937" stroke-width="4"/>
    <rect x="18" y="22" width="294" height="466" rx="30" fill="#0f2a22"/>
    <rect x="18" y="22" width="294" height="64" rx="30" fill="#064e3b"/>
    <rect x="18" y="56" width="294" height="30" fill="#064e3b"/>
    <circle cx="58" cy="54" r="16" fill="#34d399"/>
    <text x="84" y="61" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ecfdf5">Your Store</text>

    <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      <rect x="40" y="112" width="240" height="78" rx="14" fill="#d1fae5"/>
      <text x="58" y="142" font-size="17" font-weight="700" fill="#064e3b">Order confirmed</text>
      <text x="58" y="170" font-size="15" fill="#065f46">Hi Priya, #1001 · ₹1,299</text>

      <rect x="40" y="212" width="240" height="78" rx="14" fill="#d1fae5"/>
      <text x="58" y="242" font-size="17" font-weight="700" fill="#064e3b">Shipped</text>
      <text x="58" y="270" font-size="15" fill="#065f46">Track: AWB123456789</text>

      <rect x="40" y="312" width="240" height="78" rx="14" fill="#d1fae5"/>
      <text x="58" y="342" font-size="17" font-weight="700" fill="#064e3b">Delivered</text>
      <text x="58" y="370" font-size="15" fill="#065f46">Loved it? Leave a review</text>

      <rect x="40" y="412" width="150" height="44" rx="22" fill="#34d399"/>
      <text x="115" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#052e1e">Track order</text>
    </g>
  </g>

  <!-- Check badges -->
  <g transform="translate(1050 170)">
    <circle r="30" fill="#34d399"/>
    <path d="M-12 0 L-3 10 L14 -10" stroke="#052e1e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1085 420)" opacity="0.85">
    <circle r="22" fill="#a7f3d0"/>
    <path d="M-9 0 L-2 8 L10 -8" stroke="#052e1e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text id="rg-brand" x="1172" y="606" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

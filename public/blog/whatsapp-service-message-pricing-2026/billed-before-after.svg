<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Which WhatsApp messages are free and which are billed before and after 1 October 2026</title>
  <desc id="d">A table: customer messages stay free; replies and utility templates inside 24 hours become billed; marketing, authentication and utility templates outside 24 hours stay billed. Illustration by Repeat Grow (repeatgrow.com).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="90" font-size="40" font-weight="700" fill="#f8fafc">What WhatsApp charges for</text>
    <text x="660" y="160" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="middle">Until 30 Sep 2026</text>
    <text x="960" y="160" font-size="24" font-weight="700" fill="#34d399" text-anchor="middle">From 1 Oct 2026</text>
    <rect x="60" y="190" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="227" font-size="24" fill="#e5e7eb">Customer messages you</text>
    <rect x="580" y="201" width="160" height="36" rx="18" fill="#065f46"/>
    <text x="660" y="226" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle">Free</text>
    <rect x="880" y="201" width="160" height="36" rx="18" fill="#065f46"/>
    <text x="960" y="226" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle">Free</text>
    <rect x="60" y="260" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="297" font-size="24" fill="#e5e7eb">Reply inside 24 hours</text>
    <rect x="580" y="271" width="160" height="36" rx="18" fill="#065f46"/>
    <text x="660" y="296" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle">Free</text>
    <rect x="880" y="271" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="960" y="296" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="60" y="330" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="367" font-size="24" fill="#e5e7eb">Utility template inside 24 hours</text>
    <rect x="580" y="341" width="160" height="36" rx="18" fill="#065f46"/>
    <text x="660" y="366" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle">Free</text>
    <rect x="880" y="341" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="960" y="366" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="60" y="400" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="437" font-size="24" fill="#e5e7eb">Utility template outside 24 hours</text>
    <rect x="580" y="411" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="660" y="436" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="880" y="411" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="960" y="436" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="60" y="470" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="507" font-size="24" fill="#e5e7eb">Marketing template</text>
    <rect x="580" y="481" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="660" y="506" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="880" y="481" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="960" y="506" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="60" y="540" width="1080" height="58" rx="12" fill="#111827"/>
    <text x="90" y="577" font-size="24" fill="#e5e7eb">Authentication (OTP) template</text>
    <rect x="580" y="551" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="660" y="576" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
    <rect x="880" y="551" width="160" height="36" rx="18" fill="#92400e"/>
    <text x="960" y="576" font-size="20" font-weight="700" fill="#fde68a" text-anchor="middle">Billed</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

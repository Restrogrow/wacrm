<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Five short WhatsApp replies compared with one complete reply</title>
  <desc id="d">Left: five separate agent replies, each billed. Right: one complete reply with a tracking link, billed once. Illustration by Repeat Grow (repeatgrow.com).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="90" font-size="40" font-weight="700" fill="#f8fafc">Same answer, fewer billed messages</text>
    <text x="80" y="150" font-size="26" font-weight="700" fill="#fca5a5">5 replies = 5 billed messages</text>
    <text x="660" y="150" font-size="26" font-weight="700" fill="#6ee7b7">1 reply = 1 billed message</text>
    <rect x="80" y="180" width="460" height="68" rx="18" fill="#1f2937" filter="url(#soft)"/>
    <text x="104" y="223" font-size="24" fill="#e5e7eb">Hi!</text>
    <rect x="80" y="268" width="460" height="68" rx="18" fill="#1f2937" filter="url(#soft)"/>
    <text x="104" y="311" font-size="24" fill="#e5e7eb">One minute please</text>
    <rect x="80" y="356" width="460" height="68" rx="18" fill="#1f2937" filter="url(#soft)"/>
    <text x="104" y="399" font-size="24" fill="#e5e7eb">Checking your order</text>
    <rect x="80" y="444" width="460" height="68" rx="18" fill="#1f2937" filter="url(#soft)"/>
    <text x="104" y="487" font-size="24" fill="#e5e7eb">It shipped today</text>
    <rect x="80" y="532" width="460" height="68" rx="18" fill="#1f2937" filter="url(#soft)"/>
    <text x="104" y="575" font-size="24" fill="#e5e7eb">Tracking link: rg.link/t/4821</text>
    <g filter="url(#soft)"><rect x="660" y="180" width="460" height="110" rx="18" fill="#065f46"/>
    <text x="684" y="220" font-size="24" fill="#ecfdf5">Hi Priya, your order shipped</text>
    <text x="684" y="252" font-size="18" fill="#ecfdf5">today. Track it: rg.link/t/4821</text></g>
    <text x="660" y="360" font-size="22" fill="#94a3b8">Saved replies and buttons make the</text>
    <text x="660" y="392" font-size="22" fill="#94a3b8">complete answer just as fast to send.</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

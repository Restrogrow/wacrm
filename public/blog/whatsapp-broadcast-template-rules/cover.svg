<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">A WhatsApp message template with approved and rejected checks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#34d399" fill="none">
    <circle cx="200" cy="540" r="240"/>
    <circle cx="1050" cy="90" r="200"/>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(170 140)">
      <rect width="400" height="350" rx="26" fill="#f8fafc"/>
      <text x="32" y="56" font-size="18" font-weight="700" fill="#64748b">UTILITY TEMPLATE</text>
      <rect x="32" y="82" width="336" height="150" rx="16" fill="#d1fae5"/>
      <text x="54" y="122" font-size="20" fill="#064e3b">Hi {{1}}, your order</text>
      <text x="54" y="152" font-size="20" fill="#064e3b">{{2}} has shipped.</text>
      <text x="54" y="192" font-size="17" fill="#047857">Track it here: {{3}}</text>
      <rect x="32" y="262" width="150" height="50" rx="25" fill="#10b981"/>
      <text x="107" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Approved</text>
    </g>
    <g transform="translate(630 140)">
      <rect width="400" height="350" rx="26" fill="#f8fafc"/>
      <text x="32" y="56" font-size="18" font-weight="700" fill="#64748b">"UTILITY" TEMPLATE</text>
      <rect x="32" y="82" width="336" height="150" rx="16" fill="#fee2e2"/>
      <text x="54" y="122" font-size="20" fill="#7f1d1d">Big Diwali sale! 50%</text>
      <text x="54" y="152" font-size="20" fill="#7f1d1d">off everything today</text>
      <text x="54" y="192" font-size="17" fill="#991b1b">Shop now: {{1}}</text>
      <rect x="32" y="262" width="150" height="50" rx="25" fill="#ef4444"/>
      <text x="107" y="294" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Rejected</text>
    </g>
  </g>
  <text id="rg-brand" x="1172" y="606" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Diwali 2026 WhatsApp campaign calendar from 26 October to 11 November</title>
  <desc id="d">Timeline: early access 26 Oct, sale launch 30 Oct, last order day 3 Nov, Dhanteras 6 Nov, Diwali greeting 8 Nov, thank-you 11 Nov. Illustration by Repeat Grow (repeatgrow.com).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="90" font-size="40" font-weight="700" fill="#f8fafc">Diwali 2026 WhatsApp campaign calendar</text>
    <line x1="120" y1="330" x2="1080" y2="330" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="120" cy="330" r="14" fill="#10b981" stroke="#020617" stroke-width="4"/>
    <text x="120" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">26 Oct</text>
    <text x="120" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Early access</text>
    <text x="120" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">Best customers</text>
    <circle cx="312" cy="330" r="14" fill="#10b981" stroke="#020617" stroke-width="4"/>
    <text x="312" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">30 Oct</text>
    <text x="312" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Sale launch</text>
    <text x="312" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">All opted-in</text>
    <circle cx="504" cy="330" r="14" fill="#10b981" stroke="#020617" stroke-width="4"/>
    <text x="504" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">3 Nov</text>
    <text x="504" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Last order day</text>
    <text x="504" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">Delivery reminder</text>
    <circle cx="696" cy="330" r="14" fill="#10b981" stroke="#020617" stroke-width="4"/>
    <text x="696" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">6 Nov</text>
    <text x="696" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Dhanteras</text>
    <text x="696" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">Store visit</text>
    <circle cx="888" cy="330" r="20" fill="#fbbf24" stroke="#020617" stroke-width="4"/>
    <text x="888" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">8 Nov</text>
    <text x="888" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Diwali</text>
    <text x="888" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">Greeting only</text>
    <circle cx="1080" cy="330" r="14" fill="#10b981" stroke="#020617" stroke-width="4"/>
    <text x="1080" y="280" font-size="24" font-weight="700" fill="#fde68a" text-anchor="middle">11 Nov</text>
    <text x="1080" y="395" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Thank you</text>
    <text x="1080" y="428" font-size="18" fill="#94a3b8" text-anchor="middle">Review request</text>
    <text x="80" y="560" font-size="24" fill="#94a3b8">Submit every template by 25 October so approvals never hold up a send.</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

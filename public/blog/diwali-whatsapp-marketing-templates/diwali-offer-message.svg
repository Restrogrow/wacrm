<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">A Diwali sale WhatsApp message with an image header, offer text and Shop now and Stop promotions buttons</title>
  <desc id="d">Phone mock-up of a WhatsApp Marketing template for a Diwali sale, labelled: image header, one clear offer, two buttons. Illustration by Repeat Grow (repeatgrow.com).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.6" stop-color="#0f172a"/><stop offset="1" stop-color="#052e1e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <g filter="url(#soft)">
      <rect x="390" y="40" width="420" height="600" rx="40" fill="#111827" stroke="#334155" stroke-width="4"/>
      <rect x="410" y="90" width="380" height="530" rx="12" fill="#0b141a"/>
      <rect x="410" y="90" width="380" height="64" fill="#1f2c34"/>
      <circle cx="450" cy="122" r="20" fill="#10b981"/>
      <text x="482" y="118" font-size="20" font-weight="700" fill="#e5e7eb">Your Store</text>
      <text x="482" y="142" font-size="15" fill="#9ca3af">Business account</text>
      <rect x="430" y="180" width="330" height="250" rx="14" fill="#1f2c34"/>
      <rect x="430" y="180" width="330" height="110" rx="14" fill="#b45309"/>
      <text x="595" y="245" font-size="30" font-weight="700" fill="#fef3c7" text-anchor="middle">Diwali Sale</text>
      <text x="450" y="325" font-size="19" fill="#e5e7eb">Hi Riya, our Diwali sale is live.</text>
      <text x="450" y="352" font-size="19" fill="#e5e7eb">20% off ethnic wear.</text>
      <text x="450" y="379" font-size="19" fill="#e5e7eb">Order by 3 Nov for delivery.</text>
      <text x="740" y="414" font-size="14" fill="#9ca3af" text-anchor="end">10:02</text>
      <rect x="430" y="440" width="330" height="52" rx="12" fill="#1f2c34"/>
      <text x="595" y="474" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle">Shop now</text>
      <rect x="430" y="500" width="330" height="52" rx="12" fill="#1f2c34"/>
      <text x="595" y="534" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle">Stop promotions</text>
    </g>
    <text x="80" y="300" font-size="26" font-weight="700" fill="#fde68a">Image header</text>
    <text x="80" y="332" font-size="20" fill="#94a3b8">Festive banner</text>
    <text x="870" y="360" font-size="26" font-weight="700" fill="#fde68a">One clear offer</text>
    <text x="870" y="392" font-size="20" fill="#94a3b8">Name, discount, deadline</text>
    <text x="870" y="500" font-size="26" font-weight="700" fill="#fde68a">Two buttons</text>
    <text x="870" y="532" font-size="20" fill="#94a3b8">Buy, or opt out</text>
  </g>
  <text id="rg-brand" x="1172" y="651" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.6">repeatgrow.com</text>
</svg>

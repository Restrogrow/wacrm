<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t">
  <title id="t">Your business connects to Repeat Grow through Meta Embedded Signup and messages go over the official WhatsApp Cloud API</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#0f172a"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="150" width="300" height="190" rx="22" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="210" y="225" font-size="30" font-weight="700" fill="#ffffff">Your business</text>

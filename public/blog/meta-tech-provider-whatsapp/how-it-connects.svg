    <text x="600" y="265" font-size="21" fill="#a7f3d0">Meta Tech Provider</text>
    <text x="600" y="293" font-size="21" fill="#a7f3d0">Inbox, AI, broadcasts</text>

    <rect x="840" y="150" width="300" height="190" rx="22" fill="#1f2937" stroke="#334155" stroke-width="2"/>
    <text x="990" y="225" font-size="30" font-weight="700" fill="#ffffff">WhatsApp</text>

    <line x1="365" y1="245" x2="440" y2="245" stroke="#34d399" stroke-width="4" marker-end="url(#a)"/>
    <line x1="755" y1="245" x2="830" y2="245" stroke="#34d399" stroke-width="4" marker-end="url(#a)"/>
    <text x="403" y="130" font-size="20" fill="#cbd5e1">Embedded Signup</text>
